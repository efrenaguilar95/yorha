# YoRHa theming for Limine — NOT a full limine.conf, just the
# branding/color directives. Copy these lines into your existing
# /boot/limine.conf, replacing the matching keys (leave `timeout`,
# `default_entry`, boot entries, etc. untouched). See the "Bootloader
# (optional)" section of this theme's README before applying.
#
# Values below are pulled from colors.toml — see that file for the
# canonical palette if you want to tweak anything here.

interface_branding: YoRHa Bootloader
interface_branding_color: b8942f
interface_help_color: b8942f
interface_help_color_bright: b8942f

term_background: e8dcc0
term_background_bright: dcd0b4
backdrop: e8dcc0

term_foreground: 2b2620
term_foreground_bright: 1a1611

# Terminal colors (YoRHa palette)
# order: black;red;green;yellow;blue;magenta;cyan;white
term_palette: 2b2620;a13d2f;6b7d4f;b8942f;4f6a7d;8a5f6e;5f8a80;e8dcc0
term_palette_bright: 6b5f4d;c1483a;7d9160;cfa73f;5f7d93;9c6f7e;6fa093;f2e9d3
